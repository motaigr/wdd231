<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Ilustração do horizonte de Curitiba com o Jardim Botânico e araucárias</title>
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b3d2e"/>
      <stop offset="100%" stop-color="#155743"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#ceu)"/>

  <!-- Sol/lua dourado -->
  <circle cx="1300" cy="150" r="90" fill="#d4af37" opacity="0.9"/>

  <!-- Skyline ao fundo -->
  <g fill="#0f4a38">
    <rect x="60" y="330" width="70" height="270"/>
    <rect x="150" y="280" width="55" height="320"/>
    <rect x="230" y="360" width="80" height="240"/>
    <rect x="1180" y="300" width="60" height="300"/>
    <rect x="1260" y="350" width="70" height="250"/>
    <rect x="1360" y="270" width="60" height="330"/>
    <rect x="1440" y="330" width="90" height="270"/>
  </g>

  <!-- Jardim Botânico (estufa) -->
  <g fill="#f4f6f5" opacity="0.95">
    <path d="M550 600 V430 Q650 340 750 430 V600 Z"/>
    <path d="M760 600 V450 Q810 400 860 450 V600 Z"/>
    <rect x="500" y="590" width="420" height="10"/>
  </g>
  <g stroke="#0b3d2e" stroke-width="4" fill="none" opacity="0.6">
    <path d="M550 600 V430 Q650 340 750 430 V600"/>
    <path d="M580 600 V450 M615 600 V420 M650 600 V405 M685 600 V420 M720 600 V450"/>
  </g>

  <!-- Araucárias (símbolo de Curitiba) -->
  <g fill="#0f4a38">
    <path d="M300 600 L300 470 L270 480 L300 430 L275 440 L300 390 L325 440 L300 430 L330 480 L300 470 Z"/>
    <rect x="292" y="470" width="16" height="130"/>
    <path d="M1000 600 L1000 440 L965 452 L1000 395 L970 407 L1000 350 L1030 407 L1000 395 L1035 452 L1000 440 Z"/>
    <rect x="991" y="440" width="18" height="160"/>
  </g>

  <!-- Colinas suaves em primeiro plano -->
  <path d="M0 600 Q400 520 800 570 T1600 540 V600 Z" fill="#0a3327"/>
</svg>
